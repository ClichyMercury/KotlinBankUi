name: FinSim
options:
  bundleIdPrefix: com.finsim
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FinSim:
    type: application
    platform: iOS
    sources:
      - path: FinSim
    info:
      path: FinSim/Info.plist
      properties:
        CFBundleDisplayName: FinSim
        UILaunchScreen: {}
        # Compose Multiplatform iOS requires this to enable high-refresh-rate animation.
        CADisableMinimumFrameDurationOnPhone: true
        APIBaseURL: $(API_BASE_URL)
        # Autorise http://localhost:8080 en dev sans ouvrir ATS en grand : couvre les
        # hôtes non qualifiés et .local, pas les domaines publics.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finsim.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          API_BASE_URL: http://localhost:8080
        Release:
          API_BASE_URL: https://api-finsim.wharpe.com

schemes:
  FinSim-dev:
    build:
      targets:
        FinSim: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Debug
  FinSim-prod:
    build:
      targets:
        FinSim: all
    run:
      config: Release
    test:
      config: Release
    archive:
      config: Release
